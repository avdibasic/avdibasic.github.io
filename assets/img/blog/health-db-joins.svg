<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-label="Apple Health database join chain: samples joins to quantity_samples by data_id, and to objects by data_id, and objects joins to data_provenances by provenance.">
  <defs>
    <marker id="ahd-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ahd-head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <style>
      .ahd-panel { fill: var(--surface, #fff); stroke: var(--line, #cfd6e3); stroke-width: 1.5; }
      .ahd-box   { fill: var(--bg, #eef1f6); stroke: var(--line, #cfd6e3); stroke-width: 1.5; }
      .ahd-tbl   { fill: var(--text, #141b2b); font-size: 17px; font-weight: 600;
                   font-family: "Martian Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .ahd-note  { fill: var(--muted, #56607a); font-size: 11.5px;
                   font-family: "Martian Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .ahd-edge  { stroke: var(--signal, #0f766e); stroke-width: 2; fill: none; }
      .ahd-head  { fill: var(--signal, #0f766e); }
      .ahd-lbl   { fill: var(--muted, #56607a); font-size: 12px; font-weight: 600;
                   font-family: "Martian Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .ahd-lblbg { fill: var(--surface, #fff); }
    </style>
  </defs>

  <rect class="ahd-panel" x="1" y="1" width="758" height="288" rx="14"/>

  <!-- row 1 -->
  <rect class="ahd-box" x="44"  y="40"  width="196" height="76" rx="11"/>
  <text class="ahd-tbl"  x="142" y="84"  text-anchor="middle">samples</text>

  <rect class="ahd-box" x="458" y="40"  width="262" height="76" rx="11"/>
  <text class="ahd-tbl"  x="589" y="73"  text-anchor="middle">quantity_samples</text>
  <text class="ahd-note" x="589" y="95"  text-anchor="middle">the measured value</text>

  <!-- row 2 -->
  <rect class="ahd-box" x="44"  y="174" width="196" height="76" rx="11"/>
  <text class="ahd-tbl"  x="142" y="218" text-anchor="middle">objects</text>

  <rect class="ahd-box" x="458" y="174" width="262" height="76" rx="11"/>
  <text class="ahd-tbl"  x="589" y="207" text-anchor="middle">data_provenances</text>
  <text class="ahd-note" x="589" y="229" text-anchor="middle">device · OS version · timezone</text>

  <!-- edges -->
  <!-- samples -> quantity_samples -->
  <path class="ahd-edge" d="M240 78 L452 78" marker-end="url(#ahd-arrow)"/>
  <text class="ahd-lbl"  x="346" y="69" text-anchor="middle">data_id</text>

  <!-- samples -> objects -->
  <path class="ahd-edge" d="M142 116 L142 168" marker-end="url(#ahd-arrow)"/>
  <rect class="ahd-lblbg" x="150" y="133" width="60" height="18"/>
  <text class="ahd-lbl"  x="180" y="146" text-anchor="middle">data_id</text>

  <!-- objects -> data_provenances -->
  <path class="ahd-edge" d="M240 212 L452 212" marker-end="url(#ahd-arrow)"/>
  <text class="ahd-lbl"  x="346" y="203" text-anchor="middle">provenance</text>
</svg>
