<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Tarik Avdibasic</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0c1220;--text:#dce2ee;--muted:#8792ab;--accent:#f2b33d;color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:"Martian Mono",ui-monospace,Menlo,monospace;padding:1.5rem}
  main{max-width:36rem}
  h1{font-size:clamp(3rem,12vw,6rem);letter-spacing:-.06em;margin:0 0 1rem}
  p{color:var(--muted);line-height:1.7;font-size:.9rem}
  span{color:var(--accent)}
  a{color:var(--bg);background:var(--accent);padding:.55rem .9rem;border-radius:3px;text-decoration:none;font-size:.85rem;display:inline-block;margin-top:1rem}
</style>
</head>
<body><main>
  <p><span>$</span> curl -I <script>document.write(location.pathname.replace(/[<>&"]/g,""))</script></p>
  <h1>404</h1>
  <p>Nothing is served at this path. The page may have moved, or the link has a typo.</p>
  <a href="/">Go to the home page</a>
</main></body>
</html>
